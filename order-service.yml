server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecomm_order_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer:
        org.apache.kafka.common.serialization.StringSerializer

      value-serializer:
        org.springframework.kafka.support.serializer.JsonSerializer
  
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

      client:
        config:
          product-service:
            connect-timeout: 2000
            read-timeout: 3000